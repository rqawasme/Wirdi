name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow, so that the gate in front of a release is
  # this exact suite rather than a copy of it that drifts.
  workflow_call:

# A second push to a PR makes the first run's answer irrelevant. A second push
# to main does not: a push to main can be the one a release is being cut from,
# and cancelling that run would cancel the release's gate. So cancellation is
# for pull requests only — which is the case it was ever wanted for.
#
# The group is scoped by workflow name as well, so that a release run's call
# into this workflow and the ordinary CI run for the same commit on main do not
# queue behind one another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: content pipeline and data layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install -r content/requirements.txt

      # The authored JSON first: a schema error here explains every failure
      # that would otherwise surface later as a confusing build error.
      - name: Validate the authored JSON
        run: python3 content/scripts/validate_json.py

      # The Quran source JSON is committed, so this builds the real database
      # rather than an empty one, and --require-quran fails if that ever stops
      # being true instead of quietly building without it.
      - name: Build content.db
        run: python3 content/scripts/build_content.py --require-quran

      - name: Verify content invariants
        run: python3 content/scripts/verify_content.py

      # lib/data/schema/content.drift must mirror the schema the pipeline
      # actually produces. This is the check that keeps the copy honest.
      - name: Check schema parity
        run: python3 tool/check_schema_parity.py

      # A font missing a codepoint draws an empty box, or quietly borrows the
      # glyph from another face mid-word. Neither fails a build on its own, so
      # this is the step that does.
      - name: Check font coverage
        run: python3 tool/check_font_coverage.py

      # The worked examples are deliberately outside the build — their text is
      # the placeholder sentinel, and a placeholder collection sitting in the
      # app's list next to a real wird is worse than no example at all. Outside
      # the build is not outside CI: they are schema-checked and then actually
      # built, so a format change that breaks the documented example fails here
      # rather than being found by the next person to copy it.
      - name: Check the worked examples still validate and build
        run: |
          python3 content/scripts/validate_json.py --sources-dir content/examples
          python3 content/scripts/build_content.py \
            --sources-dir content/examples \
            --quran-dir content/sources/quran \
            --out "$RUNNER_TEMP/example-content.db" \
            --require-quran

      # pubspec.yaml names assets/content.db explicitly, so the asset has to
      # exist before anything builds an asset bundle — which `flutter test`
      # does. It is gitignored, being a build artifact of the step above.
      - name: Bundle content.db as the app asset
        run: tool/sync_content_asset.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: drift's generated code is committed, and a toolchain bump
          # should be a deliberate commit rather than a surprise red build.
          # Keep in step with the pin in .github/workflows/release.yml, so the
          # toolchain that tests a release is the one that builds it.
          flutter-version: 3.47.2
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      # Generated code is committed so a fresh clone can run the tests without
      # generating first. That only holds if it is actually in sync.
      - name: Check generated code is up to date
        run: |
          dart run build_runner build
          if ! git diff --quiet -- '*.g.dart'; then
            echo '::error::Generated code is stale. Run: dart run build_runner build'
            git --no-pager diff --stat -- '*.g.dart'
            exit 1
          fi

      # content.db exists by now, so the tests that check the data layer
      # against the real thing run here rather than skipping.
      - name: Test
        run: flutter test
