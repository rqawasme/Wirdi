name: wirdi
description: Daily Islamic practice — wird collections, dhikr and Quran, with counters and progress.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.3
  # Supersedes sqlite3_flutter_libs, which is end-of-life as of 0.6.0+eol:
  # package:sqlite3 3.x ships the native library for Flutter targets itself.
  sqlite3: ^3.5.2
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/
