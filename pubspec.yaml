name: wirdi
description: Daily Islamic practice — wird collections, dhikr and Quran, with counters and progress.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.3
  flutter_riverpod: ^3.4.2
  # Supersedes sqlite3_flutter_libs, which is end-of-life as of 0.6.0+eol:
  # package:sqlite3 3.x ships the native library for Flutter targets itself.
  sqlite3: ^3.5.2
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0

flutter:
  # Bundles MaterialIcons-Regular.otf. Without it every Icon in the app is a
  # missing glyph — the app bar's settings and info, the player's skips, the
  # check on a completed row — and the failure is invisible in a widget test,
  # which finds an Icon by its IconData whether or not a font can draw it.
  uses-material-design: true

  assets:
    # Named file by file rather than as a directory, so that a missing
    # content.db fails the build with "unable to locate asset" instead of
    # shipping an app with no content in it. Build it with:
    #   python3 content/scripts/build_content.py && tool/sync_content_asset.sh
    - assets/content.db

    # The OFL requires the licence to travel with the font, and the About screen
    # shows these verbatim rather than paraphrasing them.
    - assets/fonts/OFL-AmiriQuran.txt
    - assets/fonts/OFL-NotoNaskhArabic.txt
    - assets/fonts/OFL-Inter.txt

  # Bundled as local assets, never fetched: the app works fully offline, and
  # Quran text rendered in a substituted font is not the same text. The family
  # names here are the strings lib/theme/typography.dart uses; changing one
  # means changing both.
  fonts:
    # Quran text only. A Quranic Uthmani face with the mark positioning that
    # implies — see lib/theme/typography.dart on why it needs its own optical
    # size correction.
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

    # Dhikr and Arabic UI chrome.
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

    # All Latin: translations, transliteration and every piece of UI chrome.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
