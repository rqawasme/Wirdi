include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # The data layer is the only thing in the repo; an unused element is a bug.
    unused_element: warning
    unused_import: warning

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
